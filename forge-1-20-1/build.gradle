plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.17' }
tasks.named('jar') { finalizedBy 'reobfJar' }

apply from: '../gradle/command-library.gradle'

// Development runs use Mojang names; the embedded production JAR uses Forge SRG names.
java.registerFeature('production') { usingSourceSet(sourceSets.main) }
// The host provides Minecraft; never publish ForgeGradle's local mapped artifact.
[configurations.runtimeElements, configurations.productionRuntimeElements].each { it.setExtendsFrom([]) }
def devJar = tasks.register('devJar', Jar) {
    archiveClassifier = 'dev'
    from sourceSets.main.output
    manifest.from tasks.named('jar', Jar).get().manifest
    from('../LICENSE.txt') { rename { 'META-INF/LICENSE-ssec.txt' } }
}
[configurations.apiElements, configurations.runtimeElements].each {
    it.outgoing.artifacts.clear()
    it.outgoing.artifact(devJar)
}
configurations.productionRuntimeElements.outgoing.artifacts.clear()
configurations.productionRuntimeElements.outgoing.artifact(tasks.named('jar')) { builtBy 'reobfJar' }

// These Minecraft types were introduced after 1.20.1.
tasks.named('syncCommonJava') {
    exclude 'me/myogoo/ssec/command/argument/SSCDisplaySlotArgument.java'
    exclude 'me/myogoo/ssec/command/argument/SSCScoreHolderArgument.java'
    exclude 'me/myogoo/ssec/command/argument/SSCSlotRangeArgument.java'
    exclude 'me/myogoo/ssec/command/argument/SSCStyleArgument.java'
}
