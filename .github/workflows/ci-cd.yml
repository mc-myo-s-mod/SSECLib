name: CI / CD

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────
  # Build & Test
  # ─────────────────────────────────────
  build:
    name: Build ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            java: 25
          - module: neoforge-1-21-1
            java: 21
          - module: forge-1-20-1
            java: 17
          - module: neoforge-26-1-2
            java: 25
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle
          # Keep generated GitHub credentials out of the local Maven settings plugin.
          settings-path: ${{ runner.temp }}/setup-java-maven

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x javadoc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ strategy.job-index }}
          path: ${{ matrix.module }}/build/libs/*.jar
          retention-days: 7

  # ─────────────────────────────────────
  # Publish to Maven Central
  # ─────────────────────────────────────
  publish:
    name: Publish to Maven Central
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          settings-path: ${{ runner.temp }}/setup-java-maven

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PROJECT_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match project version ($PROJECT_VERSION)"
            exit 1
          fi
          echo "✅ Version matched: $TAG_VERSION"

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentralPortal -x javadoc
        env:
          MAVEN_ID: ${{ secrets.MAVEN_ID }}
          MAVEN_PW: ${{ secrets.MAVEN_PW }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
